<!DOCTYPE html>
<html>
<head>
  <title>Live Election Results</title>
</head>
<body>

<h1>🗳 Live Election Results</h1>
<div id="results">Loading...</div>

<script>
async function loadData() {
  const res = await fetch("https://sheetdb.io/api/v1/4jzckwwa9f841");
  const data = await res.json();

  let html = "<table border='1' cellpadding='10'>";
  html += "<tr><th>Candidate</th><th>Party</th><th>Votes</th><th>Status</th></tr>";

  data.forEach(row => {
    html += `<tr>
      <td>${row.Candidate}</td>
      <td>${row.Party}</td>
      <td>${row.Votes}</td>
      <td>${row.Status}</td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById("results").innerHTML = html;
}

// refresh every 10 seconds
setInterval(loadData, 10000);
loadData();
</script>

</body>
</html>
