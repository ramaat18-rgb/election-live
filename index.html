<!DOCTYPE html>
<html>
<head>
  <title>Live Election Dashboard</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

header {
  background: linear-gradient(90deg, #e63946, #1d3557);
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;
}

.marquee {
  background: #111827;
  padding: 8px;
  overflow: hidden;
  white-space: nowrap;
}

.marquee span {
  display: inline-block;
  animation: scroll 12s linear infinite;
}

@keyframes scroll {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
  padding: 15px;
}

.card {
  background: #111827;
  padding: 15px;
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1d3557;
  padding: 10px;
}

td {
  padding: 10px;
  text-align: center;
}

.won { color: #00ff88; font-weight: bold; }

@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>🗳 LIVE ELECTION RESULTS</header>

<div class="container">
  <div id="results"></div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
  
const API_URL = "https://raw.githubusercontent.com/ramaat18-rgb/election-live/main/data.json";

let chart;

async function loadData() {
  const res = await fetch(API_URL);
  const data = await res.json();

  let html = "<table>";
  html += "<tr><th>Candidate</th><th>Party</th><th>Votes</th><th>Status</th></tr>";

  let names = [];
  let votes = [];

  data.forEach(row => {
    let statusClass = row.Status === "WON" ? "won" : "";

    html += `<tr>
      <td>${row.Candidate}</td>
      <td>${row.Party}</td>
      <td>${row.Votes}</td>
      <td class="${statusClass}">${row.Status}</td>
    </tr>`;

    names.push(row.Candidate);
    votes.push(parseInt(row.Votes) || 0);
  });

  html += "</table>";
  document.getElementById("results").innerHTML = html;

  updateChart(names, votes);
}

function updateChart(names, votes) {
  const ctx = document.getElementById("chart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: names,
      datasets: [{
        label: "Votes",
        data: votes,
        backgroundColor: ["#e63946", "#457b9d", "#f4a261", "#2a9d8f"]
      }]
    }
  });
}

// refresh every 10 sec
setInterval(loadData, 10000);
loadData();
</script>

</body>
</html>
<div class="marquee">
  <span>🗳 LIVE RESULTS UPDATING... | EXIT POLLS UPDATING | LEAD CHANGES EVERY MINUTE | INDIA ELECTION DASHBOARD</span>
</div>
