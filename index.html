<!DOCTYPE html>
<html>
<head>
  <title>Live Election Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0b1a2f;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background: #e63946;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #122b45;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    th {
      background: #1d3557;
    }

    .won {
      color: #00ff88;
      font-weight: bold;
    }

    .chart-box {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>🗳 LIVE ELECTION RESULTS</header>

<div class="container">
  <div id="results"></div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
const API_URL = "https://sheetdb.io/api/v1/4jzckwwa9f841";

let chart;

async function loadData() {
  const res = await fetch(API_URL);
  const data = await res.json();

  let html = "<table>";
  html += "<tr><th>Candidate</th><th>Party</th><th>Votes</th><th>Status</th></tr>";

  let names = [];
  let votes = [];

  data.forEach(row => {
    let statusClass = row.Status === "WON" ? "won" : "";

    html += `<tr>
      <td>${row.Candidate}</td>
      <td>${row.Party}</td>
      <td>${row.Votes}</td>
      <td class="${statusClass}">${row.Status}</td>
    </tr>`;

    names.push(row.Candidate);
    votes.push(parseInt(row.Votes) || 0);
  });

  html += "</table>";
  document.getElementById("results").innerHTML = html;

  updateChart(names, votes);
}

function updateChart(names, votes) {
  const ctx = document.getElementById("chart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: names,
      datasets: [{
        label: "Votes",
        data: votes,
        backgroundColor: ["#e63946", "#457b9d", "#f4a261", "#2a9d8f"]
      }]
    }
  });
}

// refresh every 10 sec
setInterval(loadData, 10000);
loadData();
</script>

</body>
</html>
